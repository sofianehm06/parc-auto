<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParcAuto — Gestion de parc automobile</title>
  <meta name="description" content="Application web de gestion de parc automobile : véhicules, conducteurs, entretiens, carburant." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2'/%3E%3Ccircle cx='7' cy='17' r='2'/%3E%3Cpath d='M9 17h6'/%3E%3Ccircle cx='17' cy='17' r='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-name">Parc<strong>Auto</strong></span>
      </div>
      <nav class="nav" id="nav">
        <a class="nav-link" href="#/dashboard" data-route="dashboard"></a>
        <a class="nav-link" href="#/vehicules" data-route="vehicules"></a>
        <a class="nav-link" href="#/conducteurs" data-route="conducteurs"></a>
        <a class="nav-link" href="#/entretiens" data-route="entretiens"></a>
        <a class="nav-link" href="#/carburant" data-route="carburant"></a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="btn-reset" title="Réinitialiser les données de démonstration">
          Réinitialiser les données
        </button>
        <p class="sidebar-note">Données stockées localement<br />dans votre navigateur.</p>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu"></button>
        <div class="topbar-title">
          <h1 id="page-title">Tableau de bord</h1>
          <p id="page-subtitle" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main class="content" id="view" role="main"></main>
    </div>
  </div>

  <!-- Modal host -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" id="modal-close" aria-label="Fermer"></button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </div>
  </div>

  <!-- Toast host -->
  <div class="toast-host" id="toast-host" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
